site_name: ZADU
site_description: Evaluate the reliability of dimensionality reduction projections
site_url: https://hyeonword.com/zadu/
repo_url: https://github.com/hj-n/zadu
repo_name: hj-n/zadu
edit_uri: edit/master/docs/

exclude_docs: |
  development/0.5.1-acceleration-plan.md
  development/post-0.5.1-exact-scaling-plan.md

theme:
  name: material
  language: en
  icon:
    logo: material/chart-scatter-plot
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User guides:
      - Choose measures: guides/choosing-measures.md
      - Evaluate projections: guides/evaluating-projections.md
      - Evaluate many projections: guides/many-projections.md
      - Memory and exact execution: guides/execution.md
      - Pointwise scores: guides/local-scores.md
      - Visualization: guides/visualization.md
      - AI coding assistants: guides/ai-assistants.md
      - Execution backends: backends.md
  - Measures:
      - Measure reference: measures/index.md
      - Gap Index: measures/gap-index.md
  - API reference:
      - ZADU: reference/zadu.md
      - Configuration and specifications: reference/configuration.md
      - Direct measure functions: reference/direct-measures.md
  - Performance:
      - Overview: performance/index.md
      - 0.5.1 acceleration report: performance/0.5.1-acceleration-report.md
  - Development:
      - Contributing: development/contributing.md
      - Adding a measure: development/adding-a-measure.md
      - Execution DAG: development/execution-dag.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 2
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_bases: false
            show_root_heading: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hj-n/zadu
    - icon: fontawesome/solid/cube
      link: https://pypi.org/project/zadu/

copyright: Copyright &copy; ZADU contributors

extra_css:
  - stylesheets/extra.css
