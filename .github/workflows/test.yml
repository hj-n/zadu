name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lint tools
        run: python -m pip install black==26.5.1 ruff==0.16.4
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check src test scalability_eval benchmarks

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov=zadu --cov=zaduvis --cov-fail-under=85
      - name: Compile Python sources
        run: python -m compileall -q src test scalability_eval benchmarks

  snc-compat:
    runs-on: ubuntu-latest
    env:
      NUMBA_ENABLE_CUDASIM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ZADU and the legacy SNC oracle
        run: python -m pip install -e ".[dev]" "snc==0.2.0"
      - name: Compare the CPU port with SNC 0.2.0
        run: python -m pytest src/zadu/tests/test_snc_cpu_compat.py -q

  mlx:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ZADU with the optional MLX backend
        run: python -m pip install -e ".[dev,mlx]"
      - name: Run MLX provider parity and routing tests
        run: |
          python -c "import mlx.core as mx; assert mx.metal.is_available()"
          python -m pytest src/zadu/tests/test_mlx_backend.py -q

  torch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ZADU with the optional PyTorch backend
        run: python -m pip install -e ".[dev,torch]"
      - name: Run PyTorch CPU and MPS provider parity tests
        run: |
          python -c "import torch; assert torch.backends.mps.is_available()"
          python -m pytest src/zadu/tests/test_torch_backend.py -q

  build:
    needs: [lint, test, snc-compat, mlx, torch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify third-party notices are packaged
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          artifacts = list(Path("dist").iterdir())
          wheel = next(path for path in artifacts if path.suffix == ".whl")
          sdist = next(path for path in artifacts if path.name.endswith(".tar.gz"))

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith("gap-index-MIT.txt") for name in names)
              assert any(name.endswith("THIRD_PARTY_NOTICES.md") for name in names)

          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              assert any(name.endswith("gap-index-MIT.txt") for name in names)
              assert any(name.endswith("THIRD_PARTY_NOTICES.md") for name in names)
          PY
